[package]
name = "monas-sdk"
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
monas-account = { path = "../monas-account" }
monas-content = { path = "../monas-content" }
monas-filesync = { path = "../monas-filesync" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3.1.4", features = ["json"] }
url = "2.5"
dotenv = "0.15"
sha2 = "0.10"
hex = "0.4.3"
# Enable only `rt`. The SDK itself does not start a runtime; it is used only to call
# `spawn_blocking` on the tokio runtime provided by the caller (e.g. gateway).
tokio = { version = "1.49.0", features = ["rt"] }
# The SDK calls `sled::open` once so that the CEK store and Share repository share the same
# sled DB. The version is aligned with monas-content.
sled = "0.34"

[dev-dependencies]
mockito = "1.7.2"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
# For mocking the Node CBOR returned by the State Node in state read integration tests.
# The version is aligned with monas-content (= crsl-lib).
serde_cbor = "0.11"
cid = { version = "0.11", features = ["serde"] }
